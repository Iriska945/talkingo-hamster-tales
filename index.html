<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Talkingo" />
    <title>Talkingo — Liquid Glass Language Practice</title>
    <script>
      (function(){
        try {
          if (!localStorage.getItem('tg_theme_force_v4')) {
            localStorage.setItem('tg_theme', 'dark');
            localStorage.setItem('tg_theme_force_v4', '1');
          }
        } catch(e) {}
        var t = 'dark';
        try {
          var saved = localStorage.getItem('tg_theme');
          if (saved === 'light' || saved === 'dark') t = saved;
        } catch(e) {}
        document.documentElement.dataset.theme = t;
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[var(--app-bg)] text-[var(--app-text)] antialiased selection:bg-orange-500/20 select-none min-h-screen transition-colors duration-300 overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
